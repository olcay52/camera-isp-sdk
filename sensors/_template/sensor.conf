# @NAME@
#
# Sensor descriptor, see docs/sensor-descriptor.md. Generated by
# 'camera-isp-sdk new'; search for TODO.
#
# Only whole-line '#' comments are allowed: the [isp], [ae], [exposure] and
# [gain] groups are also read by the tiovxisp GStreamer element through
# GLib's key-file parser.

[sensor]
id=@ID@
name=@NAME@
status=untested
# TODO: kernel module providing the V4L2 subdev
module=@ID@
# TODO: media entity name prefix, "<entity> <bus>-<addr>" in 'media-ctl -p'
entity=@ID@
# Uncomment if the driver lives in this directory (Kbuild + Makefile)
#driver=driver

[mode]
width=@WIDTH@
height=@HEIGHT@
code=@CODE@
fps=@FPS@

[csi]
# TODO: data lanes and the link-frequencies value of the overlay
lanes=2
link-frequency=456000000
clock-noncontinuous=false

[overlay]
source=overlay.dtsi
ports=csi0;csi1

[isp]
dcc-id=@DCC_ID@

[dcc]
# Bootstrapped from @DCC_FROM@: camera module ID and H3A grid are set for
# this sensor, colour and AWB tuning are not (docs/tuning.md).
source=dcc/linear
# Bit depth the DCC sources were made for
bits=@DCC_BITS@
@DCC_BUNDLES@

[ae]
target-brightness=45
target-brightness-min=40
target-brightness-max=50
threshold=1
enable-blc=true
# exposure-min-us;exposure-max-us;again-min;again-max;dgain-min;dgain-max
# Gains are Q10 (1024 = 1x). TODO: exposure-max-us <= frame time,
# again-max <= the sensor's maximum analog gain.
range0=100;33000;1024;8192;256;256

[exposure]
# lines: V4L2_CID_EXPOSURE counts lines. The line time is derived from the
# PIXEL_RATE and HBLANK controls; set line-time-ns if the driver lacks them.
# time:  V4L2_CID_EXPOSURE counts unit-ns steps.
model=lines

[gain]
# TODO: how V4L2_CID_ANALOGUE_GAIN maps to a gain (see the datasheet or the
# libcamera camera helper of the sensor):
#   linear:  code = offset + scale * gain     (scale=, offset=)
#   inverse: code = k - k / gain              (k=, Sony IMX219: 256)
#   db:      code = 20 * log10(gain) / step   (step-db=)
#   table:   table=1024:0;2048:16;...         (gain:code pairs)
model=linear
scale=1
