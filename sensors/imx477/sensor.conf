# Sony IMX477: Raspberry Pi HQ Camera (12.3 MP, 2-lane)
#
# Driver: drivers/media/i2c/imx477.c from the Raspberry Pi kernel, ported in
# driver/ (no embedded data pad, widths cropped to what j721e-csi2rx takes).
#
# DCC: bootstrapped, not tuned. The 12-bit dependent blocks (decompand, H3A
# mux LUT, CFA, NSF4, black level) come from TI's IMX390 linear tuning, the
# colour matrix, gamma and AWB tuning from imx230. Measured on hardware: the
# white balance is usable, but the output is heavily weighted to the low end
# and AE converges dark. See README.md.

[sensor]
id=imx477
name=Sony IMX477 (Raspberry Pi HQ Camera)
status=supported
module=imx477
entity=imx477
driver=driver

[mode]
# Other driver modes: 4056x3040@10, 4056x2160, 2016x1520@40 (RAW12),
# 1328x990@120 (RAW10). Changing the mode needs 'camera-isp-sdk dcc fit-h3a'.
width=1920
height=1080
code=SRGGB12_1X12
fps=50

[csi]
lanes=2
link-frequency=450000000

[overlay]
ports=csi0;csi1

[isp]
dcc-id=477

[dcc]
source=dcc/linear
bits=12
viss=imx477_rgb2rgb_dcc.xml;imx477_h3a_aewb_dcc.xml;imx477_viss_nsf4.xml;imx477_viss_blc.xml;imx477_cfa.xml;imx477_viss_gamma_dcc.xml;imx477_rawfe_decompand.xml;imx477_h3a_mux_luts.xml
2a=imx477_awb_alg_ti3_tuning.xml;imx477_h3a_aewb_dcc.xml

[ae]
target-brightness=45
target-brightness-min=40
target-brightness-max=50
threshold=1
enable-blc=true
# exposure-min-us;exposure-max-us;again-min;again-max;dgain-min;dgain-max
# 50 fps leaves 20 ms per frame; analog gain 1x..16x (sensor max ~22x)
range0=100;19800;1024;16384;256;256

[exposure]
# V4L2_CID_EXPOSURE is in lines; the driver exposes PIXEL_RATE and HBLANK
model=lines

[gain]
# V4L2_CID_ANALOGUE_GAIN code = 1024 - 1024 / gain
model=inverse
k=1024
