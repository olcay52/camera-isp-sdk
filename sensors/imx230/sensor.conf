# Sony IMX230 on an Arducam Pivariety adapter
#
# The Pivariety board runs the sensor and exposes a generic register
# interface, so the kernel side is Arducam's arducam-pivariety driver
# (in the T3 kernel). DCC sources come from imx230-dcc-profile
# (commit 65cf25e).
#
# The stock driver cannot stream on this board: it has no
# V4L2_CID_LINK_FREQ, so cdns-csi2rx derives the D-PHY rate from PIXEL_RATE
# (2648 Mbps/lane on 2 lanes) and STREAMON fails with EOPNOTSUPP. It needs
# the patch that exposes the overlay's link-frequencies as LINK_FREQ.
#
# Bayer order, exposure and gain units below were measured on a T3 Gemstone
# O1 with firmware 0x10001 (2026-10-14).

[sensor]
id=imx230
name=Sony IMX230 (Arducam Pivariety)
status=supported
module=arducam_pivariety
# The subdev is named after the driver, not the sensor: any Pivariety
# module on the same board matches this entity.
entity=arducam-pivariety

[mode]
width=1920
height=1080
code=SRGGB10_1X10
fps=30

[csi]
lanes=2
link-frequency=493500000
clock-noncontinuous=true

[overlay]
ports=csi0;csi1

[isp]
dcc-id=230

[dcc]
source=dcc/linear
bits=10
viss=imx230_rgb2rgb_dcc.xml;imx230_h3a_aewb_dcc.xml;imx230_viss_nsf4.xml;imx230_viss_blc.xml;imx230_cfa_dcc.xml;imx230_viss_gamma_dcc.xml;imx230_linear_decompand_dcc.xml;imx230_h3a_mux_luts_dcc.xml
2a=imx230_awb_alg_ti3_tuning.xml;imx230_h3a_aewb_dcc.xml
ldc=imx230_mesh_ldc_dcc.xml

[ae]
target-brightness=45
target-brightness-min=40
target-brightness-max=50
threshold=1
enable-blc=true
# exposure-min-us;exposure-max-us;again-min;again-max;dgain-min;dgain-max
# The firmware accepts exposures from 1074 lines (~16.6 ms) and silently
# caps them about 100 lines below the frame length (1080 + VBLANK 1074),
# ~2054 lines (~31.8 ms); shorter exposures are not possible.
range0=16700;31500;1024;8192;256;256

[exposure]
# The control counts lines. The driver reports PIXEL_RATE 529.6 MHz and
# HBLANK 6272, so the line time is (1920 + 6272) / 529.6 MHz = 15.47 us.
model=lines

[gain]
# analogue_gain is linear, 100 = 1x, range 100..800 (signal x1.99 at 200,
# x3.97 at 400).
model=linear
scale=100
