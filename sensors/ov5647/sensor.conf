# OmniVision OV5647: Raspberry Pi Camera Module v1.3 (5 MP, 2-lane)
#
# Driver: the mainline ov5647 driver of the T3 6.12 kernel, packaged as
# kernel-module-ov5647-6.12.24-ti (not on the image). Values below come
# from that version; Linux 7.0 changed the 1080p PLL (PIXEL_RATE 87.5 MHz),
# added LINK_FREQ and the flip controls, and reports another Bayer order
# (see [mode] and README.md).
#
# Run end to end on a T3 Gemstone O1 (CSI0, 2026-10-16); Bayer order checked
# with the sensor's colour bar pattern. Measurements in README.md.
#
# DCC: bootstrapped from imx230 (TI's IMX219 10-bit pipeline), not tuned.
# Camera module ID, H3A grid and demosaic phases are set for this sensor
# and the black level is 16 (1024 in the 16-bit libcamera tuning); the
# colour matrix, gamma and AWB tuning are imx230's (docs/tuning.md).

[sensor]
id=ov5647
name=OmniVision OV5647 (Raspberry Pi Camera v1.3)
status=supported
# Mainline driver, CONFIG_VIDEO_OV5647=m in t3_gem_o1_defconfig
module=ov5647
entity=ov5647

[mode]
# Centre crop of the 2592x1944 array. Other driver modes: 2592x1944,
# 1296x972 (2x2 binned), 640x480 (the default until 'camera-isp-sdk setup').
# Changing the mode needs 'camera-isp-sdk dcc fit-h3a'.
width=1920
height=1080
# The 6.12 driver mirrors with both the sensor and the ISP bit
# (0x3821 = 0x06), which keeps BGGR. Linux 7.0 mirrors with the sensor bit
# only and reports SGBRG10_1X10; on such a kernel use that code and run
# 'camera-isp-sdk dcc fit-cfa ov5647'.
code=SBGGR10_1X10
fps=30

[csi]
lanes=2
# The driver has no V4L2_CID_LINK_FREQ, so cdns-csi2rx derives the rate
# from PIXEL_RATE: 81666700 x 10 bit / (2 x 2 lanes) = 204.17 MHz,
# 408 Mbps per lane. Linux 7.0 gives 218.75 MHz for its 87.5 MHz pixel
# rate, the same ratio.
link-frequency=204166750
clock-noncontinuous=true

[overlay]
ports=csi0;csi1

[isp]
dcc-id=5647

[dcc]
source=dcc/linear
bits=10
viss=ov5647_rgb2rgb_dcc.xml;ov5647_h3a_aewb_dcc.xml;ov5647_viss_nsf4.xml;ov5647_viss_blc.xml;ov5647_cfa_dcc.xml;ov5647_viss_gamma_dcc.xml;ov5647_linear_decompand_dcc.xml;ov5647_h3a_mux_luts_dcc.xml
2a=ov5647_awb_alg_ti3_tuning.xml;ov5647_h3a_aewb_dcc.xml

[ae]
target-brightness=45
target-brightness-min=40
target-brightness-max=50
threshold=1
enable-blc=true
# exposure-min-us;exposure-max-us;again-min;again-max;dgain-min;dgain-max
# The 1080p frame is 1104 lines of 29.58 us (30.6 fps) by the driver's
# timings, 30.8 us (29.4 fps) measured; the driver allows 4..1100 lines.
# Analog gain 1x..8x, as in the Raspberry Pi tuning (the register goes up
# to 63.9x).
range0=120;32500;1024;8192;256;256

[exposure]
# V4L2_CID_EXPOSURE is in lines; the line time is (1920 + HBLANK 496) /
# PIXEL_RATE, read from the subdev
model=lines

[gain]
# V4L2_CID_ANALOGUE_GAIN code = 16 x gain (16 = 1x, range 16..1023)
model=linear
scale=16
