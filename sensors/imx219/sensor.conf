# Sony IMX219: Raspberry Pi Camera Module v2
#
# Reference sensor. TI ships IMX219 tuning with Edge AI 11.0, so this
# descriptor reuses TI's DCC files from /opt/imaging/imx219 and only exists
# to run the sensor through the descriptor path of tiovxisp. Comparing
# sensor-name=imx219 against TI's sensor-name=SENSOR_SONY_IMX219_RPI on the
# same module is the quickest way to check the patched plugin.

[sensor]
id=imx219
name=Sony IMX219 (Raspberry Pi Camera v2)
status=supported
# Mainline driver, CONFIG_VIDEO_IMX219=m in t3_gem_o1_defconfig
module=imx219
entity=imx219

[mode]
width=1920
height=1080
code=SRGGB10_1X10
fps=30

[csi]
lanes=2
link-frequency=456000000

[overlay]
ports=csi0;csi1

[isp]
dcc-id=219
dcc-dir=/opt/imaging/imx219/linear
dcc-viss=dcc_viss_10b_1920x1080.bin
dcc-2a=dcc_2a_10b_1920x1080.bin

[ae]
target-brightness=45
target-brightness-min=40
target-brightness-max=50
threshold=1
enable-blc=true
# exposure-min-us;exposure-max-us;again-min;again-max;dgain-min;dgain-max
# 1080p30 frame is 1763 lines of 18.9 us; analog gain 1x..8x (1024 = 1x)
range0=10;33000;1024;8192;256;256

[exposure]
# V4L2_CID_EXPOSURE is in lines; line time comes from PIXEL_RATE and HBLANK
model=lines

[gain]
# V4L2_CID_ANALOGUE_GAIN code = 256 - 256 / gain
model=inverse
k=256
