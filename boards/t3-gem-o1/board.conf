# T3 Gemstone O1 (TI AM67A / J722S)
#
# Read by the camera-isp-sdk tool to build overlays and to check sensor modes
# against what the capture path and the ISP can take.

[board]
id=t3-gem-o1
name=T3 Gemstone O1
soc=j722s
edgeai-sdk=11.0
overlay-prefix=k3-am67a-t3-gem-o1
ports=csi0;csi1

[capture]
# j721e-csi2rx DMA transfers 16-byte words and rounds the video node width
# down to a whole number of words. RAW10/RAW12 are stored in 16-bit
# containers, RAW8 in 8-bit ones, so the sensor width must be a multiple
# of 8 (RAW10/12) or 16 (RAW8), otherwise link validation fails with EPIPE.
word-bytes=16
bit-depths=8;10;12
max-width=8192
max-height=8192

[port:csi0]
header=csi0.h
lanes=2
max-lane-rate-mbps=2500
description=CSI0, the connector farther from the Ethernet jack

[port:csi1]
header=csi1.h
lanes=2
max-lane-rate-mbps=2500
description=CSI1, the connector closer to the Ethernet jack (shared with DSI0)
